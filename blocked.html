<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>접속이 차단되었습니다</title>
    <link rel="stylesheet" href="blocked.css">
  </head>
  <body>
    <main class="block-card" aria-live="polite">
      <p class="eyebrow">FOCUS MODE</p>
      <h1>접속이 차단되었습니다</h1>
      <p class="description">YouTube와 Instagram 및 임베드 콘텐츠는 차단되어 있습니다.</p>
      <section class="countdown-panel" aria-label="수능 카운트다운">
        <p id="countdown-label" class="countdown-label">불러오는 중</p>
        <p id="countdown-time" class="countdown-time" aria-live="off">--일 --시간 --분 --초</p>
        <p id="countdown-message" class="countdown-message"></p>
      </section>
      <p class="target-date">2027년 11월 18일 00:00 · 한국 표준시</p>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
